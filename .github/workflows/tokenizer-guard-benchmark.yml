name: Tokenizer budget guarantee

on:
  push:
    branches: [tokenizer-box]
  workflow_dispatch:
    inputs:
      size_mib:
        description: Size of each generated workload in MiB
        type: string
        default: "0.05"
      include_real:
        description: Include the pinned real-world corpora
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: tokenizer-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SIZE_MIB: ${{ inputs.size_mib || '0.05' }}
      INCLUDE_REAL: ${{ github.event_name == 'push' || inputs.include_real }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the tokenizer benchmark dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          python -m pip install --upgrade pip maturin
          python -m pip install "tiktoken==0.14.0" "tokenizers==0.23.3" "numpy>=1.26" \
            "huggingface_hub>=0.24" "pytest>=8" "matplotlib>=3.8"
          maturin develop --release --features python,hf

      - name: Test the benchmark harness
        run: python -m pytest benchmarks/tests -q

      - name: Fetch pinned real-world corpora
        if: ${{ github.event_name == 'push' || inputs.include_real }}
        working-directory: benchmarks
        run: python -m chunkbench fetch

      - name: Prepare result directory
        id: run
        run: |
          run_id="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}-${GITHUB_RUN_ID}"
          mkdir -p "tokenizer_benchmarks/results/${run_id}"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Run strict cross-tokenizer acceptance benchmark
        id: benchmark
        run: |
          run_id="${{ steps.run.outputs.run_id }}"
          out="tokenizer_benchmarks/results/${run_id}"
          args=(
            --size-mib "$SIZE_MIB"
            --libs text_chipper
            --tokenizers cl100k_base o200k_base p50k_base r50k_base qwen deepseek BGE
            --no-claude
            --guard
            --strict
            --assert-guard-zero
            --out "$out"
          )
          if [ "$INCLUDE_REAL" = "true" ]; then
            args+=(--require-real)
          else
            args+=(--no-real)
          fi
          python benchmarks/cross_tokenizer.py "${args[@]}"
          python -m pip freeze > "$out/pip-freeze.txt"
          printf '%s\n' "$GITHUB_SHA" > "$out/commit.txt"

      - name: Publish report in the job summary
        if: always() && steps.benchmark.outcome == 'success'
        run: |
          echo "## Tokenizer budget guarantee" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: `${{ steps.run.outputs.run_id }}` · commit: `$GITHUB_SHA`" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat "tokenizer_benchmarks/results/${{ steps.run.outputs.run_id }}/report.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tokenizer-budget-results-${{ github.run_id }}
          path: tokenizer_benchmarks/results/${{ steps.run.outputs.run_id }}/
          if-no-files-found: warn
