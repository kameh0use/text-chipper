name: Streaming benchmark

on:
  workflow_dispatch:
    inputs:
      modes:
        description: "chipper = text_chipper's 3 modes only (minutes); blocks = + competitors fed in blocks; all = + competitors on the whole file"
        type: choice
        options: [chipper, blocks, all]
        default: chipper
      max_mib:
        description: "Use only the first N MiB of the corpus (0 = full file)"
        default: "0"
      rounds:
        description: "Timed rounds per mode (plus one extra verify run that is not timed into the medians)"
        default: "3"
      timeout_s:
        description: "Timeout per run in seconds"
        default: "2400"

jobs:
  bench:
    name: bench (${{ matrix.lane }} lane)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        lane: [single, all]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install text-chipper (from this checkout) and the pinned competitors
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Same versions as benchmarks/results/20261113_213722/pip_freeze.txt
          pip install tiktoken==0.14.0 chonkie==1.7.0 langchain-text-splitters==1.1.3 \
                      semchunk==4.1.1 semantic-text-splitter==0.33.2 numpy psutil datasets

      - name: Machine and versions
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)"
          free -h
          python --version
          pip list 2>/dev/null | grep -iE "text.chipper|tiktoken|chonkie|langchain-text|semchunk|semantic-text"

      - name: Prepare corpus (WikiText-103 raw)
        env:
          MAX_MIB: ${{ inputs.max_mib }}
        run: |
          python benchmarks/prepare_corpus.py corpus.txt
          if [ "$MAX_MIB" != "0" ]; then
            python - "$MAX_MIB" <<'PY'
          import sys
          limit = int(float(sys.argv[1]) * 1024 * 1024)
          n = 0
          with open("corpus.txt", encoding="utf-8") as src, open("corpus_cut.txt", "w", encoding="utf-8") as dst:
              for line in src:
                  dst.write(line)
                  n += len(line.encode("utf-8"))
                  if n >= limit:
                      break
          PY
            mv corpus_cut.txt corpus.txt
          fi
          ls -l corpus.txt

      - name: Smoke test every mode on a small sample
        env:
          LANE: ${{ matrix.lane }}
        run: |
          head -n 20000 corpus.txt > sample.txt
          for mode in text_chipper:stream text_chipper:whole text_chipper:blocks \
              tiktoken_window:blocks chonkie_token:blocks chonkie_recursive:blocks \
              semantic_text_splitter:blocks semchunk:blocks langchain:blocks \
              tiktoken_window:whole chonkie_token:whole chonkie_recursive:whole \
              semantic_text_splitter:whole semchunk:whole langchain:whole; do
            echo "::group::smoke $mode"
            python benchmarks/streaming_bench.py sample.txt --mode "$mode" --lane "$LANE" --block-mib 1 --verify
            echo "::endgroup::"
          done

      - name: Full run
        env:
          LANE: ${{ matrix.lane }}
          ROUNDS: ${{ inputs.rounds }}
          TIMEOUT: ${{ inputs.timeout_s }}
          PRESET: ${{ inputs.modes }}
        run: |
          CHIPPER="text_chipper:stream text_chipper:whole text_chipper:blocks"
          BLOCKS="tiktoken_window:blocks chonkie_token:blocks chonkie_recursive:blocks \
            semantic_text_splitter:blocks semchunk:blocks langchain:blocks"
          WHOLE="tiktoken_window:whole chonkie_token:whole chonkie_recursive:whole \
            semantic_text_splitter:whole semchunk:whole langchain:whole"
          case "$PRESET" in
            chipper) MODES="$CHIPPER" ;;
            blocks)  MODES="$CHIPPER $BLOCKS" ;;
            *)       MODES="$CHIPPER $BLOCKS $WHOLE" ;;
          esac
          : > results.jsonl
          for mode in $MODES; do
            # ROUNDS timed runs (no verification), then one verify run for the quality columns.
            for r in $(seq 1 "$ROUNDS") verify; do
              V=""; [ "$r" = "verify" ] && V="--verify"
              echo "::group::$mode $r ($LANE)"
              set +e
              timeout "$TIMEOUT" python benchmarks/streaming_bench.py corpus.txt \
                  --mode "$mode" --lane "$LANE" $V --out results.jsonl
              rc=$?
              set -e
              echo "::endgroup::"
              if [ $rc -ne 0 ]; then
                echo "{\"mode\":\"$mode\",\"lane\":\"$LANE\",\"status\":\"failed\",\"exit_code\":$rc}" >> results.jsonl
                break
              fi
            done
          done

      - name: Summary
        env:
          LANE: ${{ matrix.lane }}
        run: |
          SIZE=$(du -m corpus.txt | cut -f1)
          {
            echo "## Streaming benchmark: WikiText-103 raw (${SIZE} MiB), 512-token chunks, $LANE lane"
            echo
            python benchmarks/summarize_streaming.py results.jsonl
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: streaming-results-${{ matrix.lane }}
          path: results.jsonl
