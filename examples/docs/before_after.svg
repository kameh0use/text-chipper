<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 670" width="1230" height="670" role="img" aria-label="Plain tiktoken window cuts a code block mid-line; text-chipper keeps it intact in one chunk" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; white-space: pre; fill: #24292f; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 18px; font-weight: 700; fill: #24292f; }
    .sub { font-size: 12.5px; fill: #57606a; }
    .lbl { font-size: 11.5px; fill: #57606a; font-weight: 600; }
    .bad { fill: #cf222e; font-weight: 700; }
    .good { fill: #1a7f37; font-weight: 700; }
    .ctx { fill: #0969da; }
  </style>

  <rect x="0" y="0" width="1230" height="670" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- ================= LEFT: tiktoken ================= -->
  <text class="sans h" x="30" y="42">Plain tiktoken window</text>
  <text class="sans sub" x="30" y="62">Cuts every 62 tokens, wherever that lands</text>

  <!-- chunk 1 -->
  <rect x="30" y="80" width="570" height="256" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="sans lbl" x="46" y="100">chunk 1 · 62 tokens</text>
  <text class="mono" x="46" y="126"># Installing the client</text>
  <text class="mono" x="46" y="162">Install the package from PyPI and create a client. The client reads its</text>
  <text class="mono" x="46" y="180">configuration from environment variables, so no config file is needed.</text>
  <text class="mono" x="46" y="216">## Quick example</text>
  <text class="mono" x="46" y="252">```python</text>
  <text class="mono" x="46" y="270">import os</text>
  <text class="mono" x="46" y="288">from acme import Client</text>
  <text class="mono" x="46" y="324">client = Client(api_key=os.environ["ACME_KEY"], <tspan class="bad" text-decoration="underline">timeout</tspan></text>

  <!-- cut line -->
  <line x1="30" y1="358" x2="600" y2="358" stroke="#cf222e" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="sans" x="315" y="363" text-anchor="middle" font-size="13" fill="#cf222e" font-weight="700" stroke="#ffffff" stroke-width="8" style="paint-order:stroke">✂  cut here</text>

  <!-- chunk 2 -->
  <rect x="30" y="380" width="570" height="202" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="sans lbl" x="46" y="400">chunk 2 · 46 tokens</text>
  <text class="mono" x="46" y="426"><tspan class="bad" text-decoration="underline">=10)</tspan></text>
  <text class="mono" x="46" y="444">result = client.search("chunking", limit=5)</text>
  <text class="mono" x="46" y="462">for item in result:</text>
  <text class="mono" x="46" y="480">    print(item.title)</text>
  <text class="mono" x="46" y="498">```</text>
  <text class="mono" x="46" y="534">## Notes</text>
  <text class="mono" x="46" y="570">Retries are enabled by default and can be turned off with retries=0.</text>

  <rect x="30" y="600" width="570" height="44" rx="8" fill="#ffebe9" stroke="#ff8182"/>
  <text class="sans bad" x="46" y="627" font-size="14">✗  Code block split inside "timeout=10)"</text>

  <!-- ================= RIGHT: text-chipper ================= -->
  <text class="sans h" x="630" y="42">text-chipper</text>
  <text class="sans sub" x="630" y="62">Splits at block boundaries and re-counts every chunk</text>

  <!-- chunk 1 -->
  <rect x="630" y="80" width="570" height="100" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="sans lbl" x="646" y="100">chunk 1 · 35 tokens</text>
  <text class="mono ctx" x="646" y="126">[ctx:Installing the client]</text>
  <text class="mono" x="646" y="144">Install the package from PyPI and create a client. The client reads its</text>
  <text class="mono" x="646" y="162">configuration from environment variables, so no config file is needed.</text>

  <!-- chunk 2 (highlighted) -->
  <rect x="630" y="196" width="570" height="232" rx="8" fill="#f0fff4" stroke="#4ac26b" stroke-width="1.5"/>
  <text class="sans lbl" x="646" y="216">chunk 2 · 61 tokens (≤ 62)</text>
  <text class="mono ctx" x="646" y="242">[ctx:Installing the client &gt; Quick example]</text>
  <text class="mono" x="646" y="268">```python</text>
  <text class="mono" x="646" y="286">import os</text>
  <text class="mono" x="646" y="304">from acme import Client</text>
  <text class="mono" x="646" y="340">client = Client(api_key=os.environ["ACME_KEY"], <tspan class="good" text-decoration="underline">timeout=10)</tspan></text>
  <text class="mono" x="646" y="358">result = client.search("chunking", limit=5)</text>
  <text class="mono" x="646" y="376">for item in result:</text>
  <text class="mono" x="646" y="394">    print(item.title)</text>
  <text class="mono" x="646" y="412">```</text>

  <!-- chunk 3 -->
  <rect x="630" y="444" width="570" height="68" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="sans lbl" x="646" y="464">chunk 3 · 25 tokens</text>
  <text class="mono ctx" x="646" y="490">[ctx:Installing the client &gt; Notes]</text>
  <text class="mono" x="646" y="508">Retries are enabled by default and can be turned off with retries=0.</text>

  <text class="sans sub" x="630" y="548">3 chunks · 35 / 61 / 25 tokens · every chunk within the 62-token budget</text>

  <rect x="630" y="600" width="570" height="44" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
  <text class="sans good" x="646" y="627" font-size="14">✓  Code block intact, heading path attached, within budget</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
